    <div id="root"></div>


    

    <script>
(function () {
  function isOwnerLoggedIn() {
    try {
      const session = JSON.parse(
        sessionStorage.getItem("hosnek-supabase-session") || "null"
      );
      return !!session?.access_token;
    } catch {
      return false;
    }
  }

  function addOwnerLoginButton() {
    const headingRow = document.querySelector(".section-heading-row");

    if (headingRow && !document.getElementById("hosnek-owner-login-btn")) {
      const btn = document.createElement("button");

      btn.id = "hosnek-owner-login-btn";
      btn.className = "install-icon-button";
      btn.type = "button";
      btn.title = "دخول المالك";
      btn.setAttribute("aria-label", "دخول المالك");

      btn.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      `;

      btn.onclick = function () {
        location.href = "./owner-login.html";
      };

      headingRow.appendChild(btn);
    }
  }

  function addOwnerDashboardButton() {
    const feedback = document.querySelector(".feedback-link");

    if (!feedback) return;

    const old = document.getElementById("hosnek-owner-dashboard-btn");

    if (isOwnerLoggedIn()) {
      if (!old) {
        const btn = document.createElement("button");

        btn.id = "hosnek-owner-dashboard-btn";
        btn.className = "extra-link";
        btn.type = "button";

        btn.innerHTML = `
          <span class="extra-icon">
            <svg width="15" height="15" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3"></rect>
              <path d="M7 15l3-3 2 2 5-5"></path>
            </svg>
          </span>
          <span>لوحة المالك</span>
        `;

        btn.onclick = function () {
          location.href = "./owner-login.html";
        };

        feedback.parentNode.insertBefore(btn, feedback.nextSibling);
      }
    } else if (old) {
      old.remove();
    }
  }

  function update() {
    addOwnerLoginButton();
    addOwnerDashboardButton();
  }

  update();

  const observer = new MutationObserver(update);

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();

      
</script>
