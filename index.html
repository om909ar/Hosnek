  <style>

    /* ==============================
       الصفحة الرئيسية
       ============================== */

    body {
      background: #f4b942;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 25px 15px 40px;
    }

    /* العنوان */

    .title {
      text-align: center;
      color: #1A237E;
      font-size: 42px;
      font-weight: bold;
      margin: 35px 0 35px;
    }


    /* ==============================
       أزرار الأذكار
       ============================== */

    .buttonsWrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .azkar-section {
      width: 100%;
    }

    .cardButton {
  min-height: 55px;
  font-size: 18px;
  border-radius: 14px;
  padding: 8px;
}

      background: #ffffff;
      color: #1A237E;

      border: none;
      border-radius: 20px;

      padding: 20px;

      font-family: "Tajawal", Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;
    }

    .cardButton:hover {
      background: #ffffff;
      color: #1A237E;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
    }

    .cardButton:active {
      transform: scale(0.98);
    }


    /* ==============================
       قالب الأذكار
       ============================== */

    .azkar {
      width: 100%;
      margin-top: 18px;
    }

    .azkar-card {
      width: 100%;

      background: #ffffff;

      color: #111;

      padding: 25px;

      border-radius: 20px;

      font-size: 22px;
      line-height: 2.2;

      text-align: right;
      direction: rtl;

      box-sizing: border-box;

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

      overflow-wrap: break-word;

      animation: azkarFade 0.2s ease;
    }

    @keyframes azkarFade {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* ==============================
       سورة الكهف
       ============================== */

    #surahText,
    #azkarText {
      width: 100%;

      margin-top: 18px;

      padding: 25px;

      background: #ffffff;

      border-radius: 20px;

      color: #111;

      font-size: 17px;

      line-height: 2;

      text-align: right;

      direction: rtl;

      box-sizing: border-box;

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);

      overflow-wrap: break-word;

      animation: azkarFade 0.2s ease;
    }

    .bismillah {
      text-align: center;
      font-size: 30px;
      margin-top: 0;
      margin-bottom: 25px;
    }


    /* ==============================
       المسبحة
       ============================== */

    .hos-tasbeeh {
      width: 100%;
      max-width: 800px;

      height: 85px;

      margin: 25px auto;

      border: none;
      border-radius: 20px;

      background: #ffffff;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: #1A237E;

      font-size: 1.8rem;

      position: relative;

      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .hos-count {
      font-size: 30px;
      font-weight: bold;
    }

    .hos-reset {
      position: absolute;

      top: 50%;
      left: 20px;

      transform: translateY(-50%);

      font-size: 25px;

      cursor: pointer;

      color: #1A237E;

      opacity: 0.8;
    }

    .hos-hint {
      position: absolute;

      bottom: 7px;

      font-size: 12px;

      color: #1A237E;

      opacity: 0.65;

      text-align: center;

      width: 100%;

      pointer-events: none;
    }


    /* ==============================
       التوقيع
       ============================== */

    .signature {
      text-align: center;
      color: #323976;

      font-size: 14px;
      font-weight: bold;

      margin-top: 35px;
      margin-bottom: 20px;
    }


    /* ==============================
       القائمة الجانبية
       ============================== */

    :root {
      --menu-bg: #f4b942;
      --card-border: #0b2a5b;
      --card-bg: #ffffff;
      --card-radius: 16px;
    }

    .menu-btn {
      position: fixed;

      top: 18px;
      right: 18px;

      font-size: 32px;

      cursor: pointer;

      z-index: 1002;

      color: #111;

      width: 50px;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;
    }

    .menu {
      position: fixed;

      top: 0;
      right: -320px;

      width: 320px;
      height: 100%;

      background: var(--menu-bg);

      padding: 28px 18px;

      transition: right 0.28s ease;

      box-shadow: -6px 0 20px rgba(0,0,0,0.08);

      z-index: 1001;

      overflow-y: auto;

      -webkit-overflow-scrolling: touch;
    }

    .menu.open {
      right: 0;
    }

    .menu-back {
      display: block;

      margin-bottom: 15px;

      color: #013047;

      text-decoration: none;

      font-weight: 600;
    }

    .menu-item {
      display: flex;

      gap: 14px;

      align-items: center;

      background: var(--card-bg);

      border: none;

      border-radius: var(--card-radius);

      padding: 14px;

      margin-bottom: 14px;

      text-decoration: none;

      color: #0b2a5b;

      font-size: 18px;

      font-weight: bold;

      box-shadow: 0 6px 15px rgba(0,0,0,0.06);

      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
    }

    .menu-item:active,
    .menu-item:hover {
      transform: translateY(-2px);

      box-shadow: 0 8px 18px rgba(0,0,0,0.10);
    }

    .menu-item .icon {
      width: 46px;
      height: 46px;

      min-width: 46px;

      border-radius: 12px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #1A237E;

      color: white;

      font-size: 20px;

      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .menu-item .label {
      flex: 1;

      text-align: right;

      line-height: 1.2;
    }


    /* ==============================
       الجوال
       ============================== */

    @media (max-width: 600px) {

      .container {
        padding: 20px 15px 35px;
      }

      .title {
        font-size: 38px;

        margin-top: 35px;
        margin-bottom: 30px;
      }

      .buttonsWrapper {
        gap: 18px;
      }

      .cardButton {
        min-height: 105px;

        font-size: 28px;

        border-radius: 20px;

        padding: 18px;
      }

      .azkar-card {
        padding: 20px;

        font-size: 21px;

        line-height: 2.2;

        border-radius: 20px;
      }

      #surahText,
      #azkarText {
        padding: 20px;

        font-size: 21px;

        line-height: 2.2;

        border-radius: 20px;
      }

      .hos-tasbeeh {
        height: 85px;
      }

      .menu {
        width: 86%;
        right: -86%;
      }

      .menu.open {
        right: 0;
      }
    }


/* تعديل حجم أزرار الأذكار */
.cardButton {
  min-height: 60px !important;
  height: 60px !important;
  padding: 8px 12px !important;
  font-size: 20px !important;
  border-radius: 14px !important;
}

/* منع الزر من التمدد */
.azkar-section {
  height: auto !important;
}

/* إزالة اللون الأزرق بعد الضغط */
.cardButton:focus,
.cardButton:focus-visible {
  background: #ffffff !important;
  color: #1A237E !important;
  outline: none !important;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08) !important;
}

/* عند الضغط فقط */
.cardButton:active {
  background: #ffffff !important;
  color: #1A237E !important;
}


/* إخفاء مربع سورة الكهف إذا كان فارغًا */
#surahText:empty {
  display: none !important;
}

  </style>

</head>

  <!-- ==============================
       فتح وإغلاق القائمة
       ============================== -->

  <script>

    function toggleMenu() {

      document
        .getElementById('menu')
        .classList
        .toggle('open');

    }


    document.addEventListener('click', function(e) {

      var menu =
        document.getElementById('menu');

      var btn =
        document.querySelector('.menu-btn');


      if (
        !menu.contains(e.target) &&
        !btn.contains(e.target)
      ) {

        menu.classList.remove('open');

      }

    });

  </script>
